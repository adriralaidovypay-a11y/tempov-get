<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tempov</title>
<meta name="description" content="Tempov, gratuit sur iPhone et Android." />
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0e0e10;
    color: #e8e8ea;
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 20px;
    line-height: 1.6;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  img.logo { width: 200px; max-width: 60%; height: auto; margin: 0 auto 32px; display: block; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #c8c8cd; font-size: 14px; margin: 0 0 32px; }
  a.btn {
    display: block; width: 240px; max-width: 100%; box-sizing: border-box;
    padding: 14px 0; margin-bottom: 12px;
    border-radius: 12px; border: 1px solid #26262a;
    background: #17171a; color: #f2f2f4;
    font-size: 15px; font-weight: 600; text-decoration: none;
  }
  a.btn:hover { border-color: #7dd3fc; }
  .legal { margin-top: 40px; font-size: 13px; color: #8a8a90; }
  .legal a { color: #7dd3fc; }
</style>
</head>
<body>
<img class="logo" src="/tempov.png" alt="Tempov" />
<h1>Tempov</h1>
<p>Gratuit sur iPhone et Android.</p>
<a class="btn" href="https://apps.apple.com/app/id6801479295">App Store</a>
<a class="btn" href="https://play.google.com/store/apps/details?id=com.tempov.app">Google Play</a>
<div class="legal"><a href="https://privacy.tempov.app/">Confidentialité</a> · <a href="https://privacy.tempov.app/terms.html">CGU</a> · <a href="mailto:contact@tempov.app">Contact</a></div>
<script>
  // Sur mobile : redirection directe vers le bon store. Sur ordinateur : la page reste avec les deux boutons.
  var ua = navigator.userAgent || "";
  if (/android/i.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.tempov.app");
  else if (/iphone|ipad|ipod/i.test(ua)) location.replace("https://apps.apple.com/app/id6801479295");
</script>
</body>
</html>
